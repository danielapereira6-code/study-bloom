
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Bloom 🌷</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">
        <h1>🌷 Study Bloom</h1>
        <p>Floresça no seu ritmo!</p>
    </header>

    <main class="painel">

        <section class="boas-vindas">
            <h2>Olá, estudante! 💗</h2>
            <p>Pequenos passos também fazem você florescer.</p>
        </section>

        <section class="resumo">
            <div class="cartao">
                <span>📝</span>
                <h3 id="total-tarefas">0</h3>
                <p>Tarefas no total</p>
            </div>

            <div class="cartao">
                <span>🌟</span>
                <h3 id="tarefas-concluidas">0</h3>
                <p>Concluídas</p>
            </div>

            <div class="cartao">
                <span>🌱</span>
                <h3 id="tarefas-pendentes">0</h3>
                <p>Pendentes</p>
            </div>
        </section>

        <section class="tarefas">
            <h2>♡ Minhas tarefas ♡</h2>

            <form id="form-tarefa">
                <input
                    type="text"
                    id="nova-tarefa"
                    placeholder="O que você precisa estudar?"
                    aria-label="Nova tarefa"
                >
                <button type="submit">+ Adicionar</button>
            </form>

            <ul id="lista-tarefas">
                <li class="mensagem-vazia">
                    Suas tarefas aparecerão aqui! 🌸
                </li>
            </ul>
        </section>

        <footer>
            <p>Feito com 💗 e dedicação</p>
            <p>Study Bloom © 2026</p>
        </footer>

    </main>
<script src="script.js"></script>
</body>
</html>
