<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha conta | Study Bloom</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-conta">

    <main class="container-conta">

        <a href="index.html" class="voltar-inicio">
            ♡ Voltar ao Study Bloom
        </a>

        <section class="cartao-conta">

            <h1>Study Bloom</h1>

            <p class="subtitulo-conta">
                Floresça no seu tempo. 🌷
            </p>

            <h2>Bem-vinda de volta!</h2>

            <p>
                Entre na sua conta para manter seus estudos salvos.
            </p>

            <form id="form-login">
                <label for="email-login">E-mail</label>
                <input type="email" id="email-login"
                    placeholder="Seu e-mail" required>

                <label for="senha-login">Senha</label>
                <input type="password" id="senha-login"
                    placeholder="Sua senha" required>

                <button type="submit">Entrar ♡</button>
            </form>

            <p>
                Ainda não tem conta?
                <a href="#" id="mostrar-cadastro">Criar conta</a>
            </p>

            <div class="separador-conta">ou</div>

            <a href="index.html" class="continuar-sem-conta">
                Continuar sem conta
            </a>

        </section>

    </main>

</body>
</html>
